name: frontend_gocatat
description: Aplikasi Manajemen Keuangan Multi-platform (GoCatat)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Environment Variables
  flutter_dotenv: ^5.1.0
  # Networking & Cookie Management
  dio: ^5.3.3
  dio_cookie_manager: ^2.1.3
  cookie_jar: ^3.0.1
  # State Management
  provider: ^6.0.5
  # Fonts
  google_fonts: ^6.1.0
  # Formatting (Currency & Date)
  intl: ^0.19.0
  # URL Strategy (remove hash from Flutter web URLs)
  url_strategy: ^0.2.0
  # URL Launcher (open email links)
  url_launcher: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
